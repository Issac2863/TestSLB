<div class="container">
    
    <div class="sidebar">
        <button [routerLink]="['/form']">Crear</button>
        <div class="unit-options">
            <label>
                <input type="radio" name="unit" value="barriles" checked> Barriles
            </label>
            <label>
                <input type="radio" name="unit" value="galones"> Galones
            </label>
        </div>
    </div>

    
    <div class="main-content">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Ubicación</th>
            <th>Producción Diaria</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let pozo of pozos">
            <td>{{ pozo.id }}</td>
            <td>{{ pozo.nombre }}</td>
            <td>{{ pozo.ubicacion }}</td>
            <td>{{ pozo.produccionDiaria }}</td>
            <td>{{ pozo.estado }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    
    <div class="stats">
        <div class="stat-item">
            Activos/Inactivos: <span class="highlight">2/1</span>
        </div>
        <div class="stat-item">
            Producción Total Diaria: <span class="highlight">2500 Barriles</span>
        </div>
    </div>
</div>
