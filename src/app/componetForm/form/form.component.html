<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Ingreso de Pozo</title>
    <link rel="stylesheet" href="form.component.css">
</head>
<body>
    <div class="form-container">
        <h2>Ingreso de Nuevo Pozo</h2>
        <form action="procesar_pozo.php" method="POST">
            <div class="form-group">
                <label for="pozo-id">ID del Pozo</label>
                <input type="text" id="pozo-id" name="pozo_id" required>
            </div>

            <div class="form-group">
                <label for="pozo-nombre">Nombre del Pozo</label>
                <input type="text" id="pozo-nombre" name="pozo_nombre" required>
            </div>

            <div class="form-group">
                <label for="pozo-ubicacion">Ubicación</label>
                <input type="text" id="pozo-ubicacion" name="pozo_ubicacion" required>
            </div>

            <div class="form-group">
                <label for="pozo-estado">Estado</label>
                <select id="pozo-estado" name="pozo_estado" required>
                    <option value="activo">Activo</option>
                    <option value="inactivo">Inactivo</option>
                </select>
            </div>

            <div class="form-group">
                <label for="produccion-cantidad">Cantidad de Producción</label>
                <input type="number" id="produccion-cantidad" name="produccion_cantidad" required>
            </div>

            <div class="form-group">
                <label>Unidad de Producción</label>
                <div class="unit-options">
                    <label><input type="radio" name="unidad_produccion" value="barriles" checked> Barriles</label>
                    <label><input type="radio" name="unidad_produccion" value="galones"> Galones</label>
                    <label><input type="radio" name="unidad_produccion" value="litros"> Litros</label>
                </div>
            </div>

            <div class="form-group">
                <button type="submit" >Registrar Pozo</button>
            </div>
        </form>
    </div>
</body>
</html>
